services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rephub-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./repHub-backend
      dockerfile: Dockerfile
    container_name: rephub-backend
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
